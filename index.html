<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Under Construction</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, #0f172a, #1e293b);
font-family: Arial, Helvetica, sans-serif;
color: white;
padding: 2rem;
}

.container {
text-align: center;
max-width: 600px;
width: 100%;
}

.icon {
font-size: 4rem;
margin-bottom: 1.5rem;
}

h1 {
font-size: clamp(2rem, 5vw, 4rem);
margin-bottom: 1rem;
line-height: 1.1;
}

p {
font-size: clamp(1rem, 2vw, 1.2rem);
color: #cbd5e1;
line-height: 1.6;
margin-bottom: 2rem;
}

.button {
display: inline-block;
padding: 0.9rem 1.6rem;
background: #38bdf8;
color: #0f172a;
text-decoration: none;
border-radius: 999px;
font-weight: bold;
transition: 0.2s ease;
}

.button:hover {
background: #7dd3fc;
transform: translateY(-2px);
}

footer {
margin-top: 3rem;
font-size: 0.9rem;
color: #94a3b8;
}

@media (max-width: 480px) {
.icon {
font-size: 3rem;
}

p {
font-size: 1rem;
}

.button {
width: 100%;
}
}
</style>
</head>
<body>

<div class="container">
<div class="icon">🚧</div>

<h1>Website Under Construction</h1>

<p>
I'm currently redesigning this website and working on new content.
Please check back soon.
</p>

<a href="mailto:rinesch.murugathas@gmail.com" class="button">
Contact Me
</a>

<footer>
© 2026 Rinesch Murugathas
</footer>
</div>

</body>
</html>
